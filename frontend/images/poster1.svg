<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="450" fill="url(#cyber-bg)"/>
  
  <!-- Cyber Grid Lines -->
  <path d="M 0 300 L 300 300 M 0 340 L 300 340 M 0 370 L 300 370 M 0 390 L 300 390 M 0 405 L 300 405" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>
  <path d="M 150 280 L 0 450 M 150 280 L 60 450 M 150 280 L 120 450 M 150 280 L 180 450 M 150 280 L 240 450 M 150 280 L 300 450" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Neon Sun / Circle -->
  <circle cx="150" cy="180" r="70" fill="none" stroke="url(#neon-glow)" stroke-width="4" opacity="0.8"/>
  <circle cx="150" cy="180" r="50" fill="#06b6d4" opacity="0.15"/>
  
  <!-- Futuristic Silhouette / Symbol -->
  <polygon points="150,130 185,210 115,210" fill="none" stroke="#ec4899" stroke-width="3"/>
  <circle cx="150" cy="175" r="10" fill="#06b6d4"/>
  
  <!-- Title Badge -->
  <rect x="20" y="30" width="80" height="24" rx="12" fill="#ec4899" opacity="0.2"/>
  <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ec4899" text-anchor="middle">SCI-FI</text>
  
  <!-- Movie Title -->
  <text x="150" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CYBER NEXUS</text>
</svg>
