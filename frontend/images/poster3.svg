<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <radialGradient id="planet-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="450" fill="url(#space-bg)"/>
  
  <!-- Stars -->
  <circle cx="40" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="220" cy="50" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="270" cy="160" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="250" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="240" cy="300" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="50" cy="350" r="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Planet -->
  <circle cx="150" cy="200" r="75" fill="url(#planet-glow)"/>
  <ellipse cx="150" cy="200" rx="110" ry="20" fill="none" stroke="#a5b4fc" stroke-width="3" opacity="0.7" transform="rotate(-20 150 200)"/>
  
  <!-- Title Badge -->
  <rect x="20" y="30" width="80" height="24" rx="12" fill="#818cf8" opacity="0.2"/>
  <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">DRAMA</text>
  
  <!-- Movie Title -->
  <text x="150" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">STELLAR HORIZON</text>
</svg>
