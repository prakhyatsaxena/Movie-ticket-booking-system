<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="romantic-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="450" fill="url(#romantic-bg)"/>
  
  <!-- Sunset Sun -->
  <circle cx="150" cy="220" r="60" fill="url(#sun-grad)" opacity="0.9"/>
  
  <!-- Eiffel Tower Silhouette -->
  <path d="M 150 110 L 146 170 L 140 260 L 120 300 L 132 300 L 144 265 L 156 265 L 168 300 L 180 300 L 160 260 L 154 170 Z" fill="#4c1d95"/>
  <rect x="144" y="210" width="12" height="6" fill="#4c1d95"/>
  <polygon points="150,110 148,150 152,150" fill="#fde047"/>
  
  <!-- Title Badge -->
  <rect x="20" y="30" width="140" height="24" rx="12" fill="#fb7185" opacity="0.25"/>
  <text x="90" y="46" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fecdd3" text-anchor="middle">ROMANCE / COMEDY</text>
  
  <!-- Movie Title -->
  <text x="150" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PARIS IN SPRING</text>
</svg>
