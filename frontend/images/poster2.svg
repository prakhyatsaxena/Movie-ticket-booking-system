<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jungle-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="450" fill="url(#jungle-bg)"/>
  
  <!-- Light Rays -->
  <polygon points="150,0 70,300 230,300" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Temple Silhouette -->
  <path d="M 90 280 L 210 280 L 200 240 L 180 240 L 180 210 L 170 210 L 170 180 L 130 180 L 130 210 L 120 210 L 120 240 L 100 240 Z" fill="#022c22" stroke="url(#gold-grad)" stroke-width="2"/>
  <rect x="140" y="240" width="20" height="40" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Sun / Artifact -->
  <circle cx="150" cy="120" r="35" fill="url(#gold-grad)"/>
  
  <!-- Title Badge -->
  <rect x="20" y="30" width="100" height="24" rx="12" fill="#fbbf24" opacity="0.2"/>
  <text x="70" y="46" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">ADVENTURE</text>
  
  <!-- Movie Title -->
  <text x="150" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">THE LOST TEMPLE</text>
</svg>
